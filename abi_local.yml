name: fyp-local
channels:
  - conda-forge
  - defaults
dependencies:
  # PYTHON
  - python=3.13       # boxMOT supports Python 3.10 - 3.13 only
  - ipykernel
  - ipywidgets
  - blas=*=openblas

  # ML ESSENTIALS
  - numpy
  - pandas
  - matplotlib
  - scikit-learn
  - scipy
  


  # STUFF THAT DIDNT HAVE GOOD CONDA MIRRORS
  - pip
  - pip:
    # TORCH
    - torch==2.9.0      # v2.9.0 VERY IMPORTANT, newer version dont support my GPU
    - torchtext
    - torchaudio==2.9.0+cu126
    - torchvision
    - --extra-index-url https://download.pytorch.org/whl/cu126
    
    # CV
    - opencv-python
    - fvcore
    - boxmot
    - ultralytics>=8.4.58